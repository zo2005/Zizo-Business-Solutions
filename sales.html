<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المبيعات والفواتير - Zizo Solutions</title>
    <script>
        localStorage.removeItem('isLoggedIn');
        const isAuth = sessionStorage.getItem('isLoggedIn') === 'true';
        if (!isAuth) {
            sessionStorage.setItem('redirectAfterLogin', window.location.pathname.split('/').pop() || 'sales.html');
            window.location.replace('index.html');
        } else {
            sessionStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('isLoggedIn', 'true');
        }
    </script>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-title" style="display: flex; align-items: center; gap: 12px;">
                    <button class="mobile-menu-btn" type="button"></button>
                    <h1><span id="pageHeaderIcon"></span> إدارة المبيعات والفواتير</h1>
                </div>
                <div class="top-bar-actions">
                    <div class="badge badge-info" style="font-size: 13.5px; padding: 6px 14px;">
                        إجمالي المبيعات: <strong id="topGrandTotalSales" style="margin-right: 5px;">0.00 ج.م</strong>
                    </div>
                    <button class="btn btn-primary" id="printBtn" onclick="window.print()"></button>
                </div>
            </header>

            <div class="page-body">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span id="formCardIcon"></span> تسجيل / تعديل فاتورة</div>
                    </div>
                    <form id="salesForm">
                        <input type="hidden" id="editIndex" value="-1">
                        <div class="form-grid" style="margin-bottom: 18px;">
                            <div class="form-group">
                                <label for="invoiceNo">رقم الفاتورة</label>
                                <input type="text" id="invoiceNo" placeholder="مثال: INV-1001" required>
                            </div>
                            <div class="form-group">
                                <label for="deliveryDate">تاريخ التسليم</label>
                                <input type="date" id="deliveryDate" required>
                            </div>
                        </div>

                        <div style="font-weight: 700; margin-bottom: 12px; color: var(--primary);">أصناف الفاتورة:</div>
                        <div id="invoiceItemsContainer"></div>

                        <div style="display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap;">
                            <button type="button" class="btn btn-secondary" id="addItemRowBtn" onclick="addInvoiceItemRow()"></button>
                            <button type="submit" class="btn btn-primary" id="submitBtn"></button>
                        </div>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span id="tableCardIcon"></span> سجل الفواتير المسجلة</div>
                        <button type="button" class="btn btn-danger btn-sm" id="clearSalesBtn" onclick="deleteAllSales()"></button>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>رقم الفاتورة</th>
                                    <th>تاريخ التسليم</th>
                                    <th>الأصناف والتفاصيل</th>
                                    <th>إجمالي الأكياس</th>
                                    <th>إجمالي القطع</th>
                                    <th>إجمالي المبلغ</th>
                                    <th>إجراءات</th>
                                </tr>
                            </thead>
                            <tbody id="salesTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
        App.requireAuth();

        const currentUser = App.getUser();
        const storageKey = 'salesList_' + currentUser;
        const customItemsStorageKey = 'customSalesItems_' + currentUser;

        let salesData = JSON.parse(localStorage.getItem(storageKey)) || [];
        let customItems = JSON.parse(localStorage.getItem(customItemsStorageKey)) || ['تيشيرت', 'شورت', 'بنطلون', 'أكياس', 'أستك'];

        function saveAndRender() {
            renderTable(salesData);
            if (typeof FirebaseDB !== 'undefined') {
                FirebaseDB.save(storageKey, salesData);
            } else {
                localStorage.setItem(storageKey, JSON.stringify(salesData));
            }
        }

        function populateItemSelect(selectElem, selectedValue = '') {
            selectElem.innerHTML = '<option value="">اختر الصنف...</option>';
            customItems.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                if (item === selectedValue) opt.selected = true;
                selectElem.appendChild(opt);
            });
        }

        function addNewItemPrompt(selectId) {
            const name = prompt("أدخل اسم الصنف الجديد المصنع حديثاً:");
            if (name && name.trim()) {
                const trimmed = name.trim();
                if (!customItems.includes(trimmed)) {
                    customItems.push(trimmed);
                    if (typeof FirebaseDB !== 'undefined') {
                        FirebaseDB.save(customItemsStorageKey, customItems);
                    } else {
                        localStorage.setItem(customItemsStorageKey, JSON.stringify(customItems));
                    }
                }
                document.querySelectorAll('.item-type-select').forEach(sel => {
                    populateItemSelect(sel, sel.value);
                });
                const sel = document.getElementById(selectId);
                if (sel) sel.value = trimmed;
            }
        }

        function deleteSelectedItem(selectId) {
            const sel = document.getElementById(selectId);
            const val = sel.value;
            if (!val) return alert("يرجى اختيار الصنف المراد حذفه من القائمة أولاً!");
            if (confirm(`هل أنت متأكد من حذف الصنف (${val}) من القائمة نهائياً؟`)) {
                customItems = customItems.filter(i => i !== val);
                if (typeof FirebaseDB !== 'undefined') {
                    FirebaseDB.save(customItemsStorageKey, customItems);
                } else {
                    localStorage.setItem(customItemsStorageKey, JSON.stringify(customItems));
                }
                document.querySelectorAll('.item-type-select').forEach(s => populateItemSelect(s, ''));
            }
        }

        function addInvoiceItemRow(itemData = null) {
            const container = document.getElementById('invoiceItemsContainer');
            const uniqueId = 'item_row_' + Date.now() + Math.random().toString(36).substr(2, 5);
            const selectId = 'select_' + Date.now() + Math.random().toString(36).substr(2, 5);

            const card = document.createElement('div');
            card.className = 'invoice-item-card';
            card.id = uniqueId;

            const selectedType = itemData ? itemData.itemType : '';
            const modelNo = itemData ? (itemData.itemModelNo || '') : '';
            const priceVal = itemData ? itemData.itemPrice : '';

            card.innerHTML = `
                <div class="invoice-item-header">
                    <span>تفاصيل الصنف</span>
                    <button type="button" class="btn btn-danger btn-sm btn-remove-invoice-item" onclick="removeInvoiceItemCard('${uniqueId}')">
                        ${App.icon('close', 12)} <span>حذف هذا الصنف</span>
                    </button>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label>نوع الصنف</label>
                        <div style="display: flex; gap: 6px;">
                            <select class="item-type-select" id="${selectId}" style="flex: 1;" required></select>
                            <button type="button" class="btn btn-secondary btn-sm" title="إضافة صنف جديد" onclick="addNewItemPrompt('${selectId}')">${App.icon('plus', 12)}</button>
                            <button type="button" class="btn btn-danger btn-sm" title="حذف الصنف" onclick="deleteSelectedItem('${selectId}')">${App.icon('trash', 12)}</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>رقم الموديل (أو كود الأوردر)</label>
                        <input type="text" class="item-model-input" placeholder="مثال: MOD-500" value="${modelNo}">
                    </div>
                    <div class="form-group">
                        <label>سعر القطعة (ج.م)</label>
                        <input type="number" class="item-price-input" min="0" step="0.01" placeholder="0.00" value="${priceVal}" required>
                    </div>
                </div>
                <div class="bags-section" style="margin-top: 12px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <span style="font-weight: 700; font-size: 12.5px; color: var(--primary);">مجموعات الأكياس والقطع:</span>
                        <button type="button" class="btn btn-secondary btn-sm" onclick="addBagRow(this)">${App.icon('plus', 12)} إضافة أكياس</button>
                    </div>
                    <div class="bags-container"></div>
                </div>
            `;
            container.appendChild(card);

            populateItemSelect(card.querySelector('.item-type-select'), selectedType);

            const bagsContainer = card.querySelector('.bags-container');
            if (itemData && itemData.bagsDetails && itemData.bagsDetails.length > 0) {
                itemData.bagsDetails.forEach((bag, idx) => {
                    appendBagRow(bagsContainer, bag.bags, bag.itemsPerBag, idx === 0);
                });
            } else {
                appendBagRow(bagsContainer, '', '', true);
            }

            updateRemoveButtonsVisibility();
        }

        function removeInvoiceItemCard(cardId) {
            if (document.querySelectorAll('.invoice-item-card').length > 1) {
                document.getElementById(cardId).remove();
                updateRemoveButtonsVisibility();
            } else {
                alert("يجب أن تحتوي الفاتورة على صنف واحد على الأقل.");
            }
        }

        function updateRemoveButtonsVisibility() {
            const cards = document.querySelectorAll('.invoice-item-card');
            cards.forEach(card => {
                const btn = card.querySelector('.btn-remove-invoice-item');
                btn.style.display = cards.length > 1 ? 'inline-flex' : 'none';
            });
        }

        function addBagRow(btn) {
            const bagsContainer = btn.closest('.bags-section').querySelector('.bags-container');
            appendBagRow(bagsContainer, '', '', false);
        }

        function appendBagRow(container, bagVal = '', itemVal = '', isFirst = false) {
            const row = document.createElement('div');
            row.className = 'bag-row';
            row.innerHTML = `
                <input type="number" class="bag-count" min="1" placeholder="عدد الأكياس" value="${bagVal}" style="max-width: 120px;" required>
                <input type="number" class="item-count" min="1" placeholder="عدد القطع بالكيس" value="${itemVal}" style="max-width: 140px;" required>
                <button type="button" class="btn btn-danger btn-sm" onclick="removeBagRow(this)" ${isFirst ? 'style="visibility: hidden;"' : ''}>${App.icon('close', 11)}</button>
            `;
            container.appendChild(row);
        }

        function removeBagRow(btn) {
            const container = btn.closest('.bags-container');
            if (container.children.length > 1) btn.parentElement.remove();
        }

        function deleteSale(index) {
            if (confirm("هل أنت متأكد من حذف هذه الفاتورة؟")) {
                salesData.splice(index, 1);
                saveAndRender();
            }
        }

        function deleteAllSales() {
            if (salesData.length === 0) return alert("الشيت فارغ بالفعل!");
            if (confirm("تحذير: هل أنت متأكد من حذف جميع الفواتير وتصفير الشيت بالكامل؟")) {
                salesData = [];
                saveAndRender();
            }
        }

        function editSale(index) {
            const sale = salesData[index];
            document.getElementById('invoiceNo').value = sale.invoiceNo || '';
            document.getElementById('deliveryDate').value = sale.deliveryDate || '';

            const container = document.getElementById('invoiceItemsContainer');
            container.innerHTML = '';
            sale.items.forEach(item => addInvoiceItemRow(item));

            document.getElementById('editIndex').value = index;
            document.getElementById('submitBtn').innerHTML = App.icon('check', 14) + ' <span>تعديل وتحديث الفاتورة</span>';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderTable(data) {
            const tbody = document.getElementById('salesTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="color: var(--text-muted); padding: 18px;">لا توجد فواتير مبيعات مسجلة لهذا الحساب حتى الآن.</td></tr>`;
                document.getElementById('topGrandTotalSales').textContent = '0.00 ج.م';
                return;
            }

            let totalSum = 0;
            data.forEach((sale, index) => {
                totalSum += sale.grandTotalPrice;
                let detailsHTML = '';
                let totalBags = 0;
                let totalItems = 0;

                sale.items.forEach(item => {
                    totalBags += item.totalBags;
                    totalItems += item.totalItems;
                    detailsHTML += `<div style="margin-bottom: 6px; border-bottom: 1px dashed var(--border); padding-bottom: 4px; text-align: right;">`;
                    detailsHTML += `<strong>${item.itemType}</strong> ${item.itemModelNo ? '| موديل: ' + item.itemModelNo : ''} | السعر: ${item.itemPrice.toFixed(2)} ج.م`;
                    detailsHTML += `<ul class="bag-details-list">`;
                    item.bagsDetails.forEach(b => {
                        detailsHTML += `<li>${b.bags} كيس × ${b.itemsPerBag} قطعة = (${b.subTotal} قطعة)</li>`;
                    });
                    detailsHTML += `</ul></div>`;
                });

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${sale.invoiceNo}</strong></td>
                    <td>${sale.deliveryDate}</td>
                    <td>${detailsHTML}</td>
                    <td><strong>${totalBags} كيس</strong></td>
                    <td><strong>${totalItems} قطعة</strong></td>
                    <td><strong style="color: var(--primary);">${sale.grandTotalPrice.toFixed(2)} ج.م</strong></td>
                    <td>
                        <button class="btn btn-secondary btn-sm" onclick="editSale(${index})">${App.icon('edit', 12)} تعديل</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteSale(${index})">${App.icon('trash', 12)} حذف</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('topGrandTotalSales').textContent = totalSum.toFixed(2) + ' ج.م';
        }

        document.getElementById('salesForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const invoiceNo = document.getElementById('invoiceNo').value.trim();
            const deliveryDate = document.getElementById('deliveryDate').value;

            let itemsList = [];
            let grandTotalPrice = 0;

            document.querySelectorAll('.invoice-item-card').forEach(card => {
                const itemType = card.querySelector('.item-type-select').value;
                const itemModelNo = card.querySelector('.item-model-input').value.trim();
                const itemPrice = parseFloat(card.querySelector('.item-price-input').value) || 0;

                let totalBags = 0;
                let totalItems = 0;
                let bagsDetails = [];

                card.querySelectorAll('.bag-row').forEach(row => {
                    const bags = parseInt(row.querySelector('.bag-count').value) || 0;
                    const itemsPerBag = parseInt(row.querySelector('.item-count').value) || 0;
                    const subTotal = bags * itemsPerBag;
                    totalBags += bags;
                    totalItems += subTotal;
                    bagsDetails.push({ bags, itemsPerBag, subTotal });
                });

                const itemTotalPrice = totalItems * itemPrice;
                grandTotalPrice += itemTotalPrice;

                itemsList.push({
                    itemType,
                    itemModelNo,
                    itemPrice,
                    bagsDetails,
                    totalBags,
                    totalItems,
                    itemTotalPrice
                });
            });

            const editIndex = parseInt(document.getElementById('editIndex').value);
            const record = {
                id: editIndex > -1 && salesData[editIndex] ? salesData[editIndex].id : Date.now(),
                invoiceNo,
                deliveryDate,
                items: itemsList,
                grandTotalPrice
            };

            if (editIndex > -1) {
                salesData[editIndex] = record;
                document.getElementById('editIndex').value = '-1';
            } else {
                salesData.push(record);
            }

            saveAndRender();
            this.reset();
            document.getElementById('submitBtn').innerHTML = App.icon('check', 14) + ' <span>تسجيل الفاتورة بالكامل</span>';
            document.getElementById('invoiceItemsContainer').innerHTML = '';
            addInvoiceItemRow();
        });

        window.onload = function() {
            App.initLayout('sales');

            document.getElementById('pageHeaderIcon').innerHTML = App.icon('receipt', 20);
            document.getElementById('printBtn').innerHTML = App.icon('printer', 14) + ' <span>طباعة</span>';
            document.getElementById('formCardIcon').innerHTML = App.icon('edit', 16);
            document.getElementById('tableCardIcon').innerHTML = App.icon('receipt', 16);
            document.getElementById('addItemRowBtn').innerHTML = App.icon('plus', 14) + ' <span>إضافة صنف آخر بنفس الفاتورة</span>';
            document.getElementById('submitBtn').innerHTML = App.icon('check', 14) + ' <span>تسجيل الفاتورة بالكامل</span>';
            document.getElementById('clearSalesBtn').innerHTML = App.icon('trash', 13) + ' <span>تصفير شيت المبيعات</span>';

            addInvoiceItemRow();
            renderTable(salesData);

            if (typeof FirebaseDB !== 'undefined') {
                FirebaseDB.subscribe(storageKey, (data) => {
                    if (Array.isArray(data)) {
                        salesData = data;
                        renderTable(salesData);
                    }
                });

                FirebaseDB.subscribe(customItemsStorageKey, (data) => {
                    if (Array.isArray(data)) {
                        customItems = data;
                        document.querySelectorAll('.item-type-select').forEach(sel => {
                            populateItemSelect(sel, sel.value);
                        });
                    }
                });
            }
        };
    </script>
</body>
</html>
