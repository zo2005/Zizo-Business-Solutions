<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss://*.firebaseio.com https://firestore.googleapis.com; frame-ancestors 'none';">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <title>حساب الأرباح - Zizo Solutions</title>
    <script>
        localStorage.removeItem('isLoggedIn');
        const isAuth = sessionStorage.getItem('isLoggedIn') === 'true';
        if (!isAuth) {
            sessionStorage.setItem('redirectAfterLogin', window.location.pathname.split('/').pop() || 'profit.html');
            window.location.replace('index.html');
        } else {
            sessionStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('isLoggedIn', 'true');
        }
    </script>
    <link rel="stylesheet" href="app.css?v=2.2">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Zizo Solutions">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-title" style="display: flex; align-items: center; gap: 12px;">
                    <button class="mobile-menu-btn" type="button"></button>
                    <h1><span id="pageHeaderIcon"></span> حساب الأرباح (كل 15 يوماً - نصف شهري)</h1>
                </div>
                <div class="top-bar-actions">
                    <button class="btn btn-primary" id="printBtn" onclick="window.print()"></button>
                </div>
            </header>

            <div class="page-body">
                <div class="metrics-grid">
                    <div class="metric-card info">
                        <div class="title">إجمالي المبيعات المسجلة</div>
                        <div class="value" id="totalSalesVal">0.00 ج.م</div>
                    </div>
                    <div class="metric-card danger">
                        <div class="title">إجمالي المصروفات والتكاليف</div>
                        <div class="value" id="totalExpensesVal">0.00 ج.م</div>
                    </div>
                    <div class="metric-card success">
                        <div class="title">صافي الربح الإجمالي</div>
                        <div class="value" id="netProfitVal">0.00 ج.م</div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span id="formCardIcon"></span> تسجيل دورة أرباح جديدة</div>
                        <button class="btn btn-secondary btn-sm" type="button" id="refreshBtn" onclick="autoFillSystemData()"></button>
                    </div>
                    <form id="profitForm">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="startDate">من تاريخ</label>
                                <input type="date" id="startDate" onchange="calculatePeriodData()" required>
                            </div>
                            <div class="form-group">
                                <label for="endDate">إلى تاريخ</label>
                                <input type="date" id="endDate" onchange="calculatePeriodData()" required>
                            </div>
                            <div class="form-group">
                                <label for="periodName">اسم / وصف الفترة</label>
                                <input type="text" id="periodName" placeholder="مثال: أرباح النصف الأول من الشهر" required>
                            </div>
                            <div class="form-group">
                                <label for="periodSales">إجمالي المبيعات بالفترة (تلقائي)</label>
                                <input type="number" id="periodSales" min="0" step="any" placeholder="0.00" required>
                            </div>
                            <div class="form-group">
                                <label for="purchaseCost">تكلفة سحوبات المخزن بالفترة (تلقائي)</label>
                                <input type="number" id="purchaseCost" min="0" step="any" placeholder="0.00" required>
                            </div>
                            <div class="form-group">
                                <label for="salariesCost">رواتب الموظفين بالفترة (تلقائي)</label>
                                <input type="number" id="salariesCost" min="0" step="any" placeholder="0.00" required>
                            </div>
                            <div class="form-group">
                                <label for="generalExpenses">مصروفات عامة (إيجار، مياه، إلخ)</label>
                                <input type="number" id="generalExpenses" min="0" step="any" value="0" oninput="updateLiveNetProfit()" required>
                            </div>
                            <div class="form-group">
                                <label for="liveNetProfit">صافي الربح المتوقع بالفترة</label>
                                <input type="text" id="liveNetProfit" style="font-weight: 800; color: var(--primary);" readonly placeholder="0.00 ج.م">
                            </div>
                        </div>
                        <div style="margin-top: 14px;">
                            <button type="submit" class="btn btn-primary" id="submitBtn" style="min-width: 170px;"></button>
                        </div>
                    </form>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span id="tableCardIcon"></span> سجل فترات الأرباح السابقة</div>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>الفترة</th>
                                    <th>إجمالي المبيعات</th>
                                    <th>سحب المخزن</th>
                                    <th>الرواتب</th>
                                    <th>مصروفات عامة</th>
                                    <th>إجمالي المصروفات</th>
                                    <th>صافي الربح</th>
                                    <th>حذف</th>
                                </tr>
                            </thead>
                            <tbody id="profitTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js?v=2.2"></script>
    <script src="app.js?v=2.2"></script>
    <script>
        App.requireAuth();

        const currentUser = App.getUser();
        const userId = App.getUserId();
        const storageKey = 'profitList_' + userId;
        let profitData = JSON.parse(localStorage.getItem(storageKey)) || [];

        function initDefaultDates() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = today.getDate();

            let sDate, eDate;
            if (day <= 15) {
                sDate = `${year}-${month}-01`;
                eDate = `${year}-${month}-15`;
            } else {
                sDate = `${year}-${month}-16`;
                const lastDay = new Date(year, today.getMonth() + 1, 0).getDate();
                eDate = `${year}-${month}-${lastDay}`;
            }

            if (!document.getElementById('startDate').value) {
                document.getElementById('startDate').value = sDate;
            }
            if (!document.getElementById('endDate').value) {
                document.getElementById('endDate').value = eDate;
            }
        }

        function calculatePeriodData() {
            const sDate = document.getElementById('startDate').value;
            const eDate = document.getElementById('endDate').value;
            if (!sDate || !eDate) return;

            // اسم الفترة المقترح
            const periodField = document.getElementById('periodName');
            if (!periodField.value || periodField.value.startsWith('فترة من')) {
                periodField.value = `فترة من ${sDate} إلى ${eDate}`;
            }

            // 1. حساب المبيعات المسجلة بين التاريخين (deliveryDate)
            const salesKey = 'salesList_' + userId;
            const salesData = JSON.parse(localStorage.getItem(salesKey)) || [];
            let totalPeriodSales = 0;
            salesData.forEach(sale => {
                const d = sale.deliveryDate;
                if (!d || (d >= sDate && d <= eDate)) {
                    totalPeriodSales += (parseFloat(sale.grandTotalPrice) || 0);
                }
            });

            // 2. حساب تكلفة سحوبات المخزن في الفترة المحددة
            // بناء خريطة أسعار الأصناف من الجداول الثلاثة
            const itemPriceMap = {};
            const generalInv = JSON.parse(localStorage.getItem('inventoryGeneral_' + userId)) || [];
            generalInv.forEach(i => {
                if (i.name) {
                    const prc = parseFloat(i.price) || 0;
                    itemPriceMap[i.name.trim()] = prc;
                    if (Array.isArray(i.sizes)) {
                        i.sizes.forEach(sz => {
                            itemPriceMap[`${i.name.trim()} (${sz})`] = prc;
                        });
                    }
                }
            });

            const singerInv = JSON.parse(localStorage.getItem('inventorySinger_' + userId)) || [];
            singerInv.forEach(i => {
                const prc = parseFloat(i.price) || 0;
                if (i.code) itemPriceMap[`بكر سنجر كود ${i.code}`] = prc;
            });

            const overlockInv = JSON.parse(localStorage.getItem('inventoryOverlock_' + userId)) || [];
            overlockInv.forEach(i => {
                const prc = parseFloat(i.price) || 0;
                if (i.color) itemPriceMap[`بكر أوفر ${i.color}`] = prc;
            });

            // قراءة سجل العمليات inventoryHistory_ لحساب السحب بالفترة
            const historyKey = 'inventoryHistory_' + userId;
            const historyList = JSON.parse(localStorage.getItem(historyKey)) || [];
            let totalWithdrawCost = 0;

            historyList.forEach(hist => {
                if (hist.type === 'سحب') {
                    const hDate = hist.date;
                    if (!hDate || (hDate >= sDate && hDate <= eDate)) {
                        const itemName = (hist.item || '').trim();
                        let unitPrice = itemPriceMap[itemName] || 0;
                        if (!unitPrice) {
                            // محاولة مطابقة الاسم الأساسي قبل القوس
                            const baseName = itemName.split('(')[0].trim();
                            unitPrice = itemPriceMap[baseName] || 0;
                        }
                        const qty = parseFloat(hist.qty) || 0;
                        totalWithdrawCost += (qty * unitPrice);
                    }
                }
            });

            // 3. حساب الرواتب المصروفة بالفترة
            const salariesKey = 'salariesList_' + userId;
            const salariesData = JSON.parse(localStorage.getItem(salariesKey)) || [];
            let totalPeriodSalaries = 0;
            salariesData.forEach(sal => {
                const sSalDate = sal.date;
                // إذا وجد تاريخ مسجل للراتب نقارنه بالفترة، وإذا لم يكن له تاريخ نحسبه
                if (!sSalDate || (sSalDate >= sDate && sSalDate <= eDate)) {
                    totalPeriodSalaries += (parseFloat(sal.netDue) || 0);
                }
            });

            document.getElementById('periodSales').value = totalPeriodSales.toFixed(2);
            document.getElementById('purchaseCost').value = totalWithdrawCost.toFixed(2);
            document.getElementById('salariesCost').value = totalPeriodSalaries.toFixed(2);

            updateLiveNetProfit();
        }

        function updateLiveNetProfit() {
            const sales = parseFloat(document.getElementById('periodSales').value) || 0;
            const withdrawCost = parseFloat(document.getElementById('purchaseCost').value) || 0;
            const salaries = parseFloat(document.getElementById('salariesCost').value) || 0;
            const generalExp = parseFloat(document.getElementById('generalExpenses').value) || 0;

            const totalExp = withdrawCost + salaries + generalExp;
            const net = sales - totalExp;

            const netField = document.getElementById('liveNetProfit');
            if (netField) {
                netField.value = net.toFixed(2) + ' ج.م';
                netField.style.color = net >= 0 ? 'var(--primary)' : 'var(--danger)';
            }
        }

        function autoFillSystemData() {
            initDefaultDates();
            calculatePeriodData();
        }

        function saveAndRender() {
            renderTable(profitData);
            if (typeof FirebaseDB !== 'undefined') {
                FirebaseDB.save(storageKey, profitData);
            } else {
                localStorage.setItem(storageKey, JSON.stringify(profitData));
            }
        }

        function deleteProfit(id) {
            if (confirm("هل أنت متأكد من حذف هذه الفترة؟")) {
                profitData = profitData.filter(p => p.id !== id);
                saveAndRender();
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('profitTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="color: var(--text-muted); padding: 18px;">لا توجد فترات أرباح مسجلة لهذا الحساب حتى الآن.</td></tr>`;
                document.getElementById('totalSalesVal').textContent = '0.00 ج.م';
                document.getElementById('totalExpensesVal').textContent = '0.00 ج.م';
                document.getElementById('netProfitVal').textContent = '0.00 ج.م';
                return;
            }

            let sumSales = 0, sumExpenses = 0, sumNet = 0;
            data.forEach(item => {
                sumSales += item.periodSales;
                sumExpenses += item.totalExpenses;
                sumNet += item.netProfit;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${item.periodName}</strong></td>
                    <td>${item.periodSales.toFixed(2)}</td>
                    <td>${item.purchaseCost.toFixed(2)}</td>
                    <td>${item.salariesCost.toFixed(2)}</td>
                    <td>${item.generalExpenses.toFixed(2)}</td>
                    <td><strong style="color: var(--danger);">${item.totalExpenses.toFixed(2)}</strong></td>
                    <td><strong style="color: var(--primary); font-size: 13.5px;">${item.netProfit.toFixed(2)} ج.م</strong></td>
                    <td><button class="btn btn-danger btn-sm" onclick="deleteProfit(${item.id})">${App.icon('trash', 12)} حذف</button></td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('totalSalesVal').textContent = sumSales.toFixed(2) + ' ج.م';
            document.getElementById('totalExpensesVal').textContent = sumExpenses.toFixed(2) + ' ج.م';
            document.getElementById('netProfitVal').textContent = sumNet.toFixed(2) + ' ج.م';
        }

        document.getElementById('profitForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const periodName = document.getElementById('periodName').value.trim();
            const periodSales = parseFloat(document.getElementById('periodSales').value) || 0;
            const purchaseCost = parseFloat(document.getElementById('purchaseCost').value) || 0;
            const salariesCost = parseFloat(document.getElementById('salariesCost').value) || 0;
            const generalExpenses = parseFloat(document.getElementById('generalExpenses').value) || 0;

            const totalExpenses = purchaseCost + salariesCost + generalExpenses;
            const netProfit = periodSales - totalExpenses;

            profitData.push({ id: Date.now(), periodName, periodSales, purchaseCost, salariesCost, generalExpenses, totalExpenses, netProfit });
            saveAndRender();
            this.reset();
            autoFillSystemData();
        });

        window.onload = function() {
            App.initLayout('profit');

            document.getElementById('pageHeaderIcon').innerHTML = App.icon('chart', 20);
            document.getElementById('printBtn').innerHTML = App.icon('printer', 14) + ' <span>طباعة</span>';
            document.getElementById('formCardIcon').innerHTML = App.icon('edit', 16);
            document.getElementById('refreshBtn').innerHTML = App.icon('reset', 13) + ' <span>تحديث تلقائي</span>';
            document.getElementById('tableCardIcon').innerHTML = App.icon('receipt', 16);
            document.getElementById('submitBtn').innerHTML = App.icon('check', 14) + ' <span>تسجيل فترة الأرباح</span>';

            autoFillSystemData();
            renderTable(profitData);

            if (typeof FirebaseDB !== 'undefined') {
                FirebaseDB.subscribe(storageKey, (data) => {
                    if (Array.isArray(data)) {
                        profitData = data;
                        renderTable(profitData);
                    }
                });
            }
        };
    </script>
</body>
</html>
