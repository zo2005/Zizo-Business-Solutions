<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المستخدمين والصلاحيات - Zizo Solutions</title>
    <script>
        localStorage.removeItem('isLoggedIn');
        const isAuth = sessionStorage.getItem('isLoggedIn') === 'true';
        const user = sessionStorage.getItem('currentUser') || localStorage.getItem('currentUser') || '';
        const isAdmin = user === 'admin' || user === 'Zizo2312005';
        if (!isAuth) {
            sessionStorage.setItem('redirectAfterLogin', 'admin-users.html');
            window.location.replace('index.html');
        } else if (!isAdmin) {
            window.location.replace('sales.html');
        } else {
            sessionStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('isLoggedIn', 'true');
        }
    </script>
    <link rel="stylesheet" href="app.css">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Zizo Solutions">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar"></aside>

        <main class="main-content">
            <header class="top-bar">
                <div class="top-bar-title" style="display: flex; align-items: center; gap: 12px;">
                    <button class="mobile-menu-btn" type="button"></button>
                    <h1><span id="pageHeaderIcon"></span> إدارة المستخدمين والصلاحيات (لوحة المدير)</h1>
                </div>
                <div class="top-bar-actions">
                    <a href="sales.html" class="btn btn-secondary" id="backBtn"></a>
                </div>
            </header>

            <div class="page-body">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><span id="tableCardIcon"></span> حسابات المستخدمين المسجلة في السحابة</div>
                    </div>
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>اسم المستخدم</th>
                                    <th>معرّف الحساب (ID)</th>
                                    <th>حالة الحساب</th>
                                    <th>إجراءات الاعتماد</th>
                                    <th>إجراءات الحظر</th>
                                    <th>حذف الحساب نهائياً</th>
                                </tr>
                            </thead>
                            <tbody id="adminUsersTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
        App.requireAuth(true);

        let currentUsersList = JSON.parse(localStorage.getItem('systemUsers')) || [];

        function renderAdminUsersTable(usersList) {
            const tbody = document.getElementById('adminUsersTable');
            tbody.innerHTML = '';

            if (!usersList || usersList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="color: var(--text-muted); padding: 18px;">لا توجد حسابات مستخدمين مسجلة حتى الآن.</td></tr>`;
                return;
            }

            // توليد UID تلقائياً لأي حساب قديم لم يسجل دخول بعد وترحيل بياناته
            let updated = false;
            usersList.forEach(user => {
                if (!user.uid) {
                    user.uid = 'uid_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 7);
                    updated = true;
                    // ترحيل بياناته القديمة فوراً إلى الـ UID الجديد
                    if (typeof App !== 'undefined' && App.migrateUserData) {
                        App.migrateUserData(user.username, user.uid);
                    }
                }
            });

            if (updated) {
                if (typeof FirebaseDB !== 'undefined') {
                    FirebaseDB.save('systemUsers', usersList);
                } else {
                    localStorage.setItem('systemUsers', JSON.stringify(usersList));
                }
            }

            usersList.forEach((user, index) => {
                const isBlocked = !!user.isBlocked;
                const isApproved = !!user.isApproved;

                let statusBadge = `<span class="badge badge-success">${App.icon('check', 12)} نشط (مصرح)</span>`;
                if (isBlocked) {
                    statusBadge = `<span class="badge badge-danger">${App.icon('close', 12)} محظور (موقوف)</span>`;
                } else if (!isApproved) {
                    statusBadge = `<span class="badge badge-warning">${App.icon('reset', 12)} قيد المراجعة</span>`;
                }

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${user.username}</strong></td>
                    <td><code style="font-size: 10.5px; background: rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 4px; user-select: all;">${user.uid || 'بدون ID (قديم)'}</code></td>
                    <td>${statusBadge}</td>
                    <td>
                        <button class="btn btn-sm ${isApproved ? 'btn-warning' : 'btn-info'}" onclick="toggleApprove(${index})">
                            ${isApproved ? App.icon('close', 12) + ' سحب الاعتماد' : App.icon('check', 12) + ' اعتماد الحساب'}
                        </button>
                    </td>
                    <td>
                        <button class="btn btn-sm ${isBlocked ? 'btn-primary' : 'btn-danger'}" onclick="toggleBlock(${index})">
                            ${isBlocked ? App.icon('check', 12) + ' إلغاء الحظر' : App.icon('close', 12) + ' حظر الحساب'}
                        </button>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-danger" style="background-color: #b91c1c; border-color: #991b1b;" onclick="deleteUser(${index})">
                            ${App.icon('trash', 12)} حذف المستخدم
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function deleteUser(index) {
            const user = currentUsersList[index];
            if (!user) return;
            if (confirm(`تحذير: هل أنت متأكد من حذف حساب (${user.username}) نهائياً من النظام؟ لا يمكن التراجع عن هذا الإجراء.`)) {
                currentUsersList.splice(index, 1);
                renderAdminUsersTable(currentUsersList);
                if (typeof FirebaseDB !== 'undefined') {
                    await FirebaseDB.save('systemUsers', currentUsersList);
                } else {
                    localStorage.setItem('systemUsers', JSON.stringify(currentUsersList));
                }
            }
        }

        async function toggleApprove(index) {
            currentUsersList[index].isApproved = !currentUsersList[index].isApproved;
            renderAdminUsersTable(currentUsersList);
            if (typeof FirebaseDB !== 'undefined') {
                await FirebaseDB.save('systemUsers', currentUsersList);
            } else {
                localStorage.setItem('systemUsers', JSON.stringify(currentUsersList));
            }
        }

        async function toggleBlock(index) {
            currentUsersList[index].isBlocked = !currentUsersList[index].isBlocked;
            renderAdminUsersTable(currentUsersList);
            if (typeof FirebaseDB !== 'undefined') {
                await FirebaseDB.save('systemUsers', currentUsersList);
            } else {
                localStorage.setItem('systemUsers', JSON.stringify(currentUsersList));
            }
        }

        window.onload = function() {
            App.initLayout('admin');

            document.getElementById('pageHeaderIcon').innerHTML = App.icon('shield', 20);
            document.getElementById('tableCardIcon').innerHTML = App.icon('users', 16);
            document.getElementById('backBtn').innerHTML = App.icon('arrowRight', 14) + ' <span>العودة للمبيعات</span>';

            renderAdminUsersTable(currentUsersList);

            // الاستماع اللحظي للسحابة
            if (typeof FirebaseDB !== 'undefined') {
                FirebaseDB.subscribe('systemUsers', (data) => {
                    if (Array.isArray(data)) {
                        currentUsersList = data;
                        renderAdminUsersTable(currentUsersList);
                    }
                });
            }
        };
    </script>
</body>
</html>
