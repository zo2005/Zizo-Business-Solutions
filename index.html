<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Zizo Solutions</title>
    <link rel="stylesheet" href="app.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-header-icon" id="authLogoIcon"></div>
            <h2>Zizo Solutions</h2>
            <p>تسجيل الدخول إلى لوحة التحكم</p>
        </div>
        <form id="loginForm">
            <div class="form-group" style="margin-bottom: 14px;">
                <label for="username">اسم المستخدم (بالإنجليزي فقط)</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" required autocomplete="username">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="password">كلمة المرور (بالإنجليزي فقط)</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="loginBtn" style="padding: 11px;"></button>
            <div class="alert-msg error" id="errorMsg">اسم المستخدم أو كلمة المرور غير صحيحة، أو تم حظر الحساب!</div>
        </form>
        <div class="auth-footer" style="text-align: center;">
            <span>ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></span>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('authLogoIcon').innerHTML = App.icon('factory', 26);
        document.getElementById('loginBtn').innerHTML = App.icon('lock', 16) + ' <span>دخول للوحة التحكم</span>';

        // مسح أي جلسة قديمة محفوظة في localStorage فور فتح صفحة الدخول
        localStorage.removeItem('isLoggedIn');

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const errorElem = document.getElementById('errorMsg');
            const submitBtn = document.getElementById('loginBtn');
            errorElem.style.display = 'none';

            const arabicRegex = /[\u0600-\u06FF]/;
            if (arabicRegex.test(user) || arabicRegex.test(pass)) {
                errorElem.textContent = "يجب كتابة اسم المستخدم وكلمة المرور باللغة الإنجليزية والأرقام فقط.";
                errorElem.style.display = 'block';
                return;
            }

            // فحص كلمة مرور المدير (الحالية أو المحدثة)
            let adminSavedPass = localStorage.getItem('adminPassword') || '200522004';
            if (typeof FirebaseDB !== 'undefined') {
                const adminSettings = await FirebaseDB.get('adminSettings');
                if (adminSettings && adminSettings.adminPassword) {
                    adminSavedPass = adminSettings.adminPassword;
                    localStorage.setItem('adminPassword', adminSavedPass);
                }
            }

            // حساب الإدارة الرئيسي (دخول مباشر)
            if ((user === 'Zizo2312005' || user === 'admin') && (pass === adminSavedPass || pass === '200522004')) {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('currentUser', 'admin');
                localStorage.removeItem('isLoggedIn');
                localStorage.setItem('currentUser', 'admin');
                const target = sessionStorage.getItem('redirectAfterLogin') || 'sales.html';
                sessionStorage.removeItem('redirectAfterLogin');
                window.location.href = target;
                return;
            }

            // تعطيل الزر مؤقتاً أثناء التحقق
            submitBtn.disabled = true;
            submitBtn.innerHTML = App.icon('lock', 16) + ' <span>جاري التحقق سحابياً...</span>';

            let usersList = [];
            if (typeof FirebaseDB !== 'undefined') {
                usersList = await FirebaseDB.get('systemUsers', []) || [];
            }
            if (!usersList.length) {
                usersList = JSON.parse(localStorage.getItem('systemUsers')) || [];
            }

            const foundUser = usersList.find(u => u.username === user && u.password === pass);

            submitBtn.disabled = false;
            submitBtn.innerHTML = App.icon('lock', 16) + ' <span>دخول للوحة التحكم</span>';

            if (foundUser) {
                if (foundUser.isBlocked) {
                    alert("عذراً، هذا الحساب تم حظره من قبل الإدارة.");
                    return;
                }
                if (!foundUser.isApproved) {
                    alert("الحساب في انتظار موافقة الإدارة.");
                    return;
                }
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('currentUser', foundUser.username);
                localStorage.removeItem('isLoggedIn');
                localStorage.setItem('currentUser', foundUser.username);
                const target = sessionStorage.getItem('redirectAfterLogin') || 'sales.html';
                sessionStorage.removeItem('redirectAfterLogin');
                window.location.href = target;
                return;
            }

            errorElem.style.display = 'block';
        });
    </script>
</body>
</html>
