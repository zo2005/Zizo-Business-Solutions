<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - Zizo Solutions</title>
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#10b981">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Zizo Solutions">
    <link rel="stylesheet" href="app.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-header-icon" id="regLogoIcon"></div>
            <h2>إنشاء حساب جديد</h2>
            <p>انضم إلى نظام إدارة المصنع الذكي</p>
        </div>
        <form id="regForm">
            <div class="form-group" style="margin-bottom: 14px;">
                <label for="newUsername">اسم المستخدم (بالإنجليزي فقط)</label>
                <input type="text" id="newUsername" placeholder="مثال: Ahmed_2025" required autocomplete="username" pattern="[A-Za-z0-9_.-]+" title="يرجى كتابة اسم المستخدم باللغة الإنجليزية والأرقام فقط">
                <small style="color: var(--text-muted); font-size: 11px;">مسموح بالحروف الإنجليزية والأرقام والرموز (_ . -) بدون مسافات</small>
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="newPassword">كلمة المرور (بالإنجليزي فقط)</label>
                <input type="password" id="newPassword" placeholder="اكتب كلمة المرور (إنجليزي فقط)" required autocomplete="new-password">
                <small style="color: var(--text-muted); font-size: 11px;">يجب أن تكون كلمة المرور باللغة الإنجليزية أو الأرقام فقط</small>
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="regBtn" style="padding: 11px;"></button>
            <div class="alert-msg success" id="successMsg">تم إنشاء الحساب بنجاح! جاري تحويلك لتسجيل الدخول...</div>
        </form>
        <div class="auth-footer" style="text-align: center;">
            <a href="index.html">العودة لتسجيل الدخول</a>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('regLogoIcon').innerHTML = '<span>Z</span>';
        document.getElementById('regBtn').innerHTML = App.icon('check', 16) + ' <span>تسجيل الحساب</span>';

        document.getElementById('regForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const regBtn = document.getElementById('regBtn');

            if (!username || !password) return;

            const englishRegex = /^[A-Za-z0-9_.-]+$/;
            const arabicRegex = /[\u0600-\u06FF]/;

            // التحقق من أن اسم المستخدم بالإنجليزي فقط
            if (!englishRegex.test(username)) {
                alert("تنبيه: يجب أن يكون اسم المستخدم بالحروف الإنجليزية والأرقام فقط وبدون مسافات.");
                return;
            }

            // التحقق من أن كلمة المرور بدون حروف عربية
            if (arabicRegex.test(password)) {
                alert("تنبيه: يجب أن تكون كلمة المرور بالحروف الإنجليزية أو الأرقام فقط (ممنوع الحروف العربية).");
                return;
            }

            regBtn.disabled = true;
            regBtn.innerHTML = App.icon('sparkles', 16) + ' <span>جاري إنشاء الحساب...</span>';

            let usersList = [];
            if (typeof FirebaseDB !== 'undefined') {
                usersList = await FirebaseDB.get('systemUsers', []) || [];
            }
            if (!usersList.length) {
                usersList = JSON.parse(localStorage.getItem('systemUsers')) || [];
            }

            if (usersList.some(u => u.username.toLowerCase() === username.toLowerCase()) || username.toLowerCase() === 'admin' || username.toLowerCase() === 'zizo2312005') {
                alert("اسم المستخدم هذا موجود بالفعل، يرجى اختيار اسم آخر.");
                regBtn.disabled = false;
                regBtn.innerHTML = App.icon('check', 16) + ' <span>تسجيل الحساب</span>';
                return;
            }

            // توليد User ID ثابت فريد لكل مستخدم (لا يتغير حتى لو غيّر الاسم أو كلمة المرور)
            const uid = 'uid_' + Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 9);

            const newUser = {
                uid,
                username,
                password,
                isBlocked: false,
                isApproved: false,
                createdAt: new Date().toISOString()
            };

            usersList.push(newUser);

            if (typeof FirebaseDB !== 'undefined') {
                await FirebaseDB.save('systemUsers', usersList);
            } else {
                localStorage.setItem('systemUsers', JSON.stringify(usersList));
            }

            document.getElementById('successMsg').style.display = 'block';
            this.reset();
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1200);
        });
    </script>
</body>
</html>
