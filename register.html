<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - Zizo Solutions</title>
    <link rel="stylesheet" href="app.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-header-icon" id="regLogoIcon"></div>
            <h2>إنشاء حساب جديد</h2>
            <p>انضم إلى نظام إدارة المصنع السحابي</p>
        </div>
        <form id="regForm">
            <div class="form-group" style="margin-bottom: 14px;">
                <label for="newUsername">اسم المستخدم</label>
                <input type="text" id="newUsername" placeholder="اختر اسم مستخدم" required autocomplete="username">
            </div>
            <div class="form-group" style="margin-bottom: 20px;">
                <label for="newPassword">كلمة المرور</label>
                <input type="password" id="newPassword" placeholder="اكتب كلمة المرور" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-block" id="regBtn" style="padding: 11px;"></button>
            <div class="alert-msg success" id="successMsg">تم إنشاء الحساب بنجاح وحفظه سحابياً! جاري تحويلك لتسجيل الدخول...</div>
        </form>
        <div class="auth-footer" style="display:flex; justify-content:space-between; align-items:center;">
            <a href="index.html">العودة لتسجيل الدخول</a>
            <span id="firebaseStatusBadge" style="display:flex; align-items:center;"></span>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
    <script>
        document.getElementById('regLogoIcon').innerHTML = App.icon('sparkles', 24);
        document.getElementById('regBtn').innerHTML = App.icon('check', 16) + ' <span>تسجيل الحساب</span>';

        if (typeof FirebaseDB !== 'undefined') {
            FirebaseDB.updateStatusBadge(FirebaseDB.status);
        }

        document.getElementById('regForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const regBtn = document.getElementById('regBtn');

            if (!username || !password) return;

            regBtn.disabled = true;
            regBtn.innerHTML = App.icon('sparkles', 16) + ' <span>جاري حفظ الحساب سحابياً...</span>';

            let usersList = [];
            if (typeof FirebaseDB !== 'undefined') {
                usersList = await FirebaseDB.get('systemUsers', []) || [];
            }
            if (!usersList.length) {
                usersList = JSON.parse(localStorage.getItem('systemUsers')) || [];
            }

            if (usersList.some(u => u.username.toLowerCase() === username.toLowerCase()) || username.toLowerCase() === 'admin') {
                alert("اسم المستخدم هذا موجود بالفعل، يرجى اختيار اسم آخر.");
                regBtn.disabled = false;
                regBtn.innerHTML = App.icon('check', 16) + ' <span>تسجيل الحساب</span>';
                return;
            }

            const newUser = {
                username,
                password,
                isBlocked: false,
                isApproved: false,
                createdAt: new Date().toISOString()
            };

            usersList.push(newUser);

            if (typeof FirebaseDB !== 'undefined') {
                await FirebaseDB.save('systemUsers', usersList);
            } else {
                localStorage.setItem('systemUsers', JSON.stringify(usersList));
            }

            document.getElementById('successMsg').style.display = 'block';
            this.reset();
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1200);
        });
    </script>
</body>
</html>
